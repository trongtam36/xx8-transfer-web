<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>XX8 | ABC VIP - Chuyển điểm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="video-bg" aria-hidden="true">
    <video id="backgroundVideo" autoplay muted loop playsinline preload="auto">
      <source src="assets/background.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>
  </div>

  <main class="page-shell">
    <section class="transfer-card" aria-live="polite">
      <div class="brand-wrap">
        <img class="brand-logo" src="assets/logo.jpg" alt="XX8 ABC VIP" />
      </div>

      <div id="formView" class="view view-active">
        <div class="section-head">
          <h1>XỬ LÝ CHUYỂN ĐIỂM</h1>
        </div>

        <form id="transferForm" novalidate>
          <label class="field">
            <span class="sr-only">Tài khoản nguồn</span>
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
            </span>
            <input id="sourceAccount" name="sourceAccount" autocomplete="off" placeholder="Nhập tài khoản nguồn" />
          </label>

          <label class="field">
            <span class="sr-only">Tài khoản đến</span>
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
            </span>
            <input id="targetAccount" name="targetAccount" autocomplete="off" placeholder="Nhập tài khoản đến" />
          </label>

          <label class="field">
            <span class="sr-only">Số điểm chuyển</span>
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
            </span>
            <input id="points" name="points" type="number" min="1" step="1" inputmode="numeric" placeholder="Nhập số điểm chuyển" />
          </label>

          <label class="human-check">
            <span class="fake-checkbox-wrap">
              <input id="humanCheck" type="checkbox" />
              <span class="fake-checkbox" aria-hidden="true"></span>
            </span>
            <span class="human-copy">Verify you are human</span>
            <span class="cf-mark" aria-hidden="true">
              <span class="cf-cloud">☁</span>
              <span class="cf-text">CLOUDFLARE<small>Privacy · Terms</small></span>
            </span>
          </label>

          <button class="primary-btn" type="submit">CHUYỂN ĐIỂM</button>
        </form>
      </div>

      <div id="successView" class="view" hidden>
        <div class="success-head">
          <div class="success-badge" aria-hidden="true">✓</div>
          <h1>CHUYỂN THÀNH CÔNG</h1>
          <p>Ngày chuyển: <span id="successDate">--</span></p>
        </div>

        <div class="result-list">
          <div class="result-row">
            <span>Tài khoản nguồn:</span>
            <strong id="resultSource">--</strong>
          </div>
          <div class="result-row">
            <span>Tài khoản đến:</span>
            <strong id="resultTarget">--</strong>
          </div>
          <div class="result-row">
            <span>Số điểm chuyển:</span>
            <strong id="resultPoints" class="accent-text">--</strong>
          </div>
        </div>

        <p class="success-note">Chúc bạn chơi game vui vẻ!</p>
        <button id="closeSuccess" class="primary-btn" type="button">ĐÓNG</button>
      </div>
    </section>
  </main>

  <div id="dialogBackdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div id="dialogIcon" class="dialog-icon" aria-hidden="true">!</div>
      <h2 id="dialogTitle">Vui lòng kiểm tra lại</h2>
      <p id="dialogMessage">Vui lòng nhập đầy đủ tài khoản nguồn, tài khoản đến và số điểm chuyển.</p>
      <button id="dialogConfirm" class="primary-btn" type="button">ĐÃ HIỂU</button>
    </section>
  </div>

  <!-- Điều khiển thử nghiệm chỉ xuất hiện khi chạy local.
       Bóng trắng 6 sao = thất bại; bóng trắng 5 sao = thành công.
       Vị trí được tính theo tọa độ video để che biểu tượng ở góc. -->
  <button id="resultBall" class="result-ball" type="button" hidden aria-label="Quả bóng 6 sao: trạng thái thất bại">
    <svg class="ball-pattern" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ball-inner-ring" cx="50" cy="50" r="42" />
      <g class="ball-seams">
        <path d="M20 33 C35 26, 65 26, 80 33" />
        <path d="M16 51 C34 45, 66 45, 84 51" />
        <path d="M21 70 C37 63, 63 63, 79 70" />
        <path d="M35 14 C31 32, 31 68, 35 86" />
        <path d="M65 14 C69 32, 69 68, 65 86" />
      </g>

      <g class="stars-six">
        <path class="ball-star" d="M50 13.5 53.2 20.1 60.5 21.2 55.2 26.3 56.5 33.5 50 30.1 43.5 33.5 44.8 26.3 39.5 21.2 46.8 20.1Z" />
        <path class="ball-star" d="M73.5 27 76 32.2 81.8 33 77.6 37.1 78.6 42.9 73.5 40.2 68.4 42.9 69.4 37.1 65.2 33 71 32.2Z" />
        <path class="ball-star" d="M73.5 57 76 62.2 81.8 63 77.6 67.1 78.6 72.9 73.5 70.2 68.4 72.9 69.4 67.1 65.2 63 71 62.2Z" />
        <path class="ball-star" d="M50 69 52.7 74.5 58.8 75.4 54.4 79.7 55.4 85.8 50 83 44.6 85.8 45.6 79.7 41.2 75.4 47.3 74.5Z" />
        <path class="ball-star" d="M26.5 57 29 62.2 34.8 63 30.6 67.1 31.6 72.9 26.5 70.2 21.4 72.9 22.4 67.1 18.2 63 24 62.2Z" />
        <path class="ball-star" d="M26.5 27 29 32.2 34.8 33 30.6 37.1 31.6 42.9 26.5 40.2 21.4 42.9 22.4 37.1 18.2 33 24 32.2Z" />
      </g>

      <g class="stars-five">
        <path class="ball-star" d="M50 12 53.3 18.7 60.7 19.8 55.4 25 56.6 32.3 50 28.8 43.4 32.3 44.6 25 39.3 19.8 46.7 18.7Z" />
        <path class="ball-star" d="M72 35 75 41 81.6 42 76.8 46.7 77.9 53.3 72 50.2 66.1 53.3 67.2 46.7 62.4 42 69 41Z" />
        <path class="ball-star" d="M63.5 63.5 66.4 69.5 73 70.5 68.3 75.1 69.4 81.7 63.5 78.6 57.6 81.7 58.7 75.1 54 70.5 60.6 69.5Z" />
        <path class="ball-star" d="M36.5 63.5 39.4 69.5 46 70.5 41.3 75.1 42.4 81.7 36.5 78.6 30.6 81.7 31.7 75.1 27 70.5 33.6 69.5Z" />
        <path class="ball-star" d="M28 35 31 41 37.6 42 32.8 46.7 33.9 53.3 28 50.2 22.1 53.3 23.2 46.7 18.4 42 25 41Z" />
      </g>
    </svg>
    <span class="ball-gloss" aria-hidden="true"></span>
  </button>

  <script src="app.js"></script>
</body>
</html>
